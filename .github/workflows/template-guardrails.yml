name: Template guardrails

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  scaffold-smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Ensure executable bits for local scripts
        run: |
          chmod +x scripts/setup-template-repo.sh scripts/check-guardrails.sh scripts/check-migration.sh .githooks/install.sh .githooks/commit-msg .githooks/pre-push

      - name: Verify migrated taxonomy layout
        run: ./scripts/check-migration.sh

      - name: Scaffold repo into a temporary directory
        run: |
          tmpdir="$(mktemp -d)"
          ./scripts/setup-template-repo.sh "$tmpdir/scaffolded-repo" --name scaffolded-repo
          cd "$tmpdir/scaffolded-repo"

          for path in AGENTS.md README.md docs work scratch scripts warp-pipe .githooks .gitmessage; do
            test -e "$path"
          done

          ./scripts/check-migration.sh
          ./scripts/check-guardrails.sh
